[audio]
# auto = 跟随系统默认输出设备对应的回环（推荐，设备改名/增删后不会失联）
loopback_device = auto
mic_device = auto
sample_rate = 48000
record_format = wav
# auto/both：老师回环 + 我的麦克风 两个通道都启用（谁有声音就翻谁，双通道都有声音就双通道翻译）
# teacher：只翻老师；me：只翻我
capture_mode = auto
# 通道设备打开失败后的自动重试间隔（秒）：插上麦克风/切回设备后能自动恢复
device_retry_seconds = 10
# 连续多少秒没听到声音就在状态栏提醒（老师静音/我静音都能看出来）
silence_hint_seconds = 10

[language]
source_lang = ru
target_lang = zh

# ===== 识别服务（语音大模型）=====
# 地址与 Key 都独立于翻译服务，可以是完全不同的服务商
[asr]
# 识别引擎：aliyun（阿里云百炼 WebSocket，国内稳定）/ yandex（Yandex SpeechKit gRPC，俄罗斯本地稳定）
engine = aliyun
model = qwen-audio-3.0-asr-flash-streaming
ws_url = wss://dashscope.aliyuncs.com/api-ws/v1/inference
# 识别服务 API Key：留空则回退用 [translate] api_key
# 环境变量 HILANG_ASR_API_KEY 优先级最高
api_key =
sample_rate = 16000
format = pcm
frame_ms = 100
max_sentence_silence = 1000
# 长句边识别边翻译：说到句号/问号等边界就先翻一段（不用等整句说完，字幕出得更早）
chunk_stream = true
chunk_max_chars = 120
chunk_min_chars = 30
heartbeat_sec = 20
reconnect_buffer_seconds = 2
timeout_sec = 10

# ===== Yandex SpeechKit（俄罗斯本地 ASR，从俄罗斯访问稳定）=====
# 当 [asr] engine = yandex 时使用
[yandex]
# Yandex Cloud 服务账号 API Key
# 注册：Yandex Cloud → 服务账号 → 分配 ai.speechkit-stt.user 角色 → 获取 API Key
api_key =
# 语言代码：ru-RU / en-US / auto（自动检测）
language_code = ru-RU

# ===== 翻译服务（翻译大模型）=====
[translate]
engine = openai
base_url = https://dashscope.aliyuncs.com/compatible-mode
# 2026-10 实测（5 句真实俄语课句 + App 原提示词）：
#   速度：qwen-flash 565ms / qwen3.6-flash 881ms / qwen-plus 930ms / qwen3.6-plus 1.2s
#   质量：qwen-plus ≈ qwen3.6-plus > qwen3.6-flash > qwen-flash
# qwen3.x 默认思考模式（7~23 秒），程序已自动 enable_thinking=false
model_name = qwen-plus
fallback_model_name = qwen3.6-plus
# 翻译服务 API Key：环境变量 HILANG_TRANSLATE_API_KEY / HILANG_API_KEY 优先
api_key =
topic =
glossary =
context_sentences = 5
timeout_sec = 30
# 并发翻译句数（1=串行；2~3 语速快时不积压，字幕仍严格按顺序）
workers = 2
# 单句超过这么多秒没翻完，先显示原文（后台结果回来仍写进文件）
stuck_flush_sec = 12
max_tokens = 256
temperature = 0.2
auto_correct = true

[ui]
font_size = 10
opacity = 85
# 玻璃皮肤：dark（深色玻璃）/ aurora（极光玻璃）
skin = dark
# 字幕模式最多同时显示几段（1 段 = 一句识别原文 + 它的译文）
caption_segments = 3
# 字幕模式文字颜色：auto = 跟随底色自动切黑/白；也可写 #FFFFFF / #000000
caption_text_color = auto
text_color = #FFFFFF
teacher_color = #FFFFFF
me_color = #52C41A
history_lines = 8
show_my_translation = true
window_width = 480
window_height = 220
# 上次退出时的窗口位置（-1 = 不记忆；程序会自动写回）
window_x = -1
window_y = -1
# 不翻译时静置多少分钟自动收起到托盘（0 = 从不）
auto_hide_minutes = 5

[session]
output_dir = sessions
file_prefix = 课堂
# 结束会话后是否自动生成纪要（默认 false = 手动点工具栏「纪要」按钮；点退出永不生成）
auto_summary = false
flush_interval = 60
summary_block_chars = 4000
summary_model_name =
